[package]
name = "mvmctl"
version = "0.2.0"
edition = "2021"
description = "MicroVM controller and systemd generator for QEMU and Cloud-Hypervisor"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
libc = "0.2"
